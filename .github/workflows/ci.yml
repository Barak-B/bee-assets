name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  survey-app:
    name: bee-solar-survey · typecheck, test, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bee-solar-survey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bee-solar-survey/package-lock.json
      - run: npm ci
      - run: npx tsc
      - run: npm test
      - run: npm run build
      - name: Service worker and manifest were emitted
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest
      - name: Pages Functions bundle (customer quote links)
        run: npm run functions:check
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: E2E — report, price book, quotes, BOQ Excel, offline
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/bee-solar-survey/playwright-report
          retention-days: 7

  quote-core:
    name: quote-core · typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/quote-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/quote-core/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

  site-tools:
    name: site-tools · typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-tools/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
