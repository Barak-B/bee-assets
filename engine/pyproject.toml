[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bee-cad"
version = "0.1.0"
description = "B.E.E. — ברק הנדסת חשמל: CAD engine (DXF/DWG) for single-line diagrams, panel layouts and PV layouts"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "pydantic>=2.5",
    "python-bidi>=0.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "pillow>=10"]

[project.scripts]
bee-cad = "bee_cad.cli:main"

[tool.setuptools.packages.find]
include = ["bee_cad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
